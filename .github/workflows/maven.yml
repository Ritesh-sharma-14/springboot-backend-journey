name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all Maven modules (find pom.xml and build each)
        run: |
          set -e
          echo "Searching for pom.xml files..."
          # find all pom.xml files, ignore .github and .mvn directories
          mapfile -t POMS < <(find . -name pom.xml -not -path "./.github/*" -not -path "./.mvn/*" -not -path "./target/*")
          if [ ${#POMS[@]} -eq 0 ]; then
            echo "No pom.xml found in repository. Failing the job."
            exit 1
          fi
          for p in "${POMS[@]}"; do
            echo "==== Building module: $p ===="
            mvn -B -f "$p" package
          done

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
